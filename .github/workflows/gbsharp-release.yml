#
# Publishes the GB# runtime for every platform GB# supports, on a tag.
#
# GB# consumes these archives through tools/get-emulator.ps1, which verifies a
# SHA256 from tools/emulator.lock.json before it will use one. Generating that
# lock file here, from the archives that were actually uploaded, is what keeps
# the two repositories honest: bumping the pinned version in GB# is copying one
# file rather than five hashes by hand.
name: GB# runtime release

# Tags are namespaced because the fork inherited upstream's v* tags, so v*
# means "a binjgb release" here and gbsharp-v* means "a GB# runtime release".
on:
  push:
    tags:
      - 'gbsharp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: cmake
        run: >
          cmake -S . -B out -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=install

      - name: build both flavours
        run: >
          cmake --build out --config Release
          --target gbsharp_emulator gbsharp_emulator_debug
          gbsharp_emulator_static gbsharp_emulator_debug_static

      - name: install
        run: cmake --install out --config Release

      - name: check the boundary
        shell: bash
        run: |
          shopt -s nullglob
          python scripts/check_gbsharp_library.py \
            install/bin/*gbsharp_emulator*.dll \
            install/bin/*gbsharp_emulator*.so \
            install/bin/*gbsharp_emulator*.dylib

      # Debug info is not shipped: the archives are fetched by every GB#
      # contributor, so size is a cost they all pay.
      - name: strip
        if: runner.os != 'Windows'
        run: find install -type f \( -name '*.so' -o -name '*.dylib' \) -exec strip -x {} +

      # Zip on Windows and tar.gz elsewhere, matching the GBDK archives that
      # tools/get-gbdk.ps1 already knows how to unpack.
      - name: archive
        shell: bash
        run: |
          cd install
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../gbsharp-emulator-${{ matrix.rid }}.zip" .
          else
            tar -czf "../gbsharp-emulator-${{ matrix.rid }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gbsharp-emulator-${{ matrix.rid }}
          path: gbsharp-emulator-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: generate the lock file
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, json, os, glob

          tag = os.environ['TAG']
          repository = os.environ['REPOSITORY']
          base = 'https://github.com/%s/releases/download/%s/' % (repository, tag)

          assets = {}
          for path in sorted(glob.glob('archives/gbsharp-emulator-*')):
            name = os.path.basename(path)
            # gbsharp-emulator-<rid>.<ext>, where <rid> has no dots in it.
            rid = name[len('gbsharp-emulator-'):].split('.')[0]
            with open(path, 'rb') as f:
              digest = hashlib.sha256(f.read()).hexdigest()
            assets[rid] = {
              'url': base + name,
              'sha256': digest,
              'size': os.path.getsize(path),
            }

          lock = {
            '$comment': 'Pinned GB# emulator runtime. Generated by the fork'
                        ' release workflow; copy this file over'
                        ' tools/emulator.lock.json in GB# to bump the version.',
            'version': tag[len('gbsharp-v'):] if tag.startswith('gbsharp-v') else tag,
            'releaseUrl': 'https://github.com/%s/releases/tag/%s' % (repository, tag),
            'assets': assets,
          }

          with open('archives/emulator.lock.json', 'w') as f:
            json.dump(lock, f, indent=2)
            f.write('\n')

          print(json.dumps(lock, indent=2))
          PY

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" archives/* --clobber
