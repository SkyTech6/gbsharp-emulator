name: CI

# Upstream's own CI, kept because it is what says binjgb's application and wasm
# target still build after a GB# patch. The rgbds-live and gbstudio wasm
# variants are gone: they exist for named downstream projects that GB# is not.
#
# The tag trigger is gone. It fired on gbsharp-v* release tags and rebuilt the
# SDL application, the imgui debugger and the wasm module, none of which a GB#
# runtime release contains.
on:
  push:
    branches:
      - main
  pull_request:

env:
  EM_VERSION: 4.0.8
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: install packages (linux)
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build libsdl2-dev
      if: matrix.os == 'ubuntu-latest'

    - name: install packages (macos)
      run: brew install ninja SDL2
      if: matrix.os == 'macos-latest'

    - name: mkdir bin
      run: mkdir -p bin
      if: matrix.os == 'windows-latest'

    - name: download sdl2 (windows)
      uses: albin-johansson/download-sdl2@v2
      with:
        version: 2.0.14
        sources_destination: .
        binaries_destination: bin
      if: matrix.os == 'windows-latest'

    - name: mkdir out
      run: mkdir -p out

    - name: cmake (linux + macos)
      run: cmake -S . -B out -G Ninja
      if: matrix.os != 'windows-latest'

    - name: cmake (windows)
      run: cmake -S . -B out "-DSDL2_ROOT_DIR=SDL2-2.0.14"
      if: matrix.os == 'windows-latest'

    - name: build
      run: cmake --build out

    # The compatibility suite used to run here as well, on two platforms. It now
    # runs once, in gbsharp.yml, which is the workflow that has to fail when a
    # GB# patch changes emulation.

  # Upstream builds its wasm module three ways: plain, and once each for
  # rgbds-live and GB Studio, which are downstream projects with their own needs.
  # GB# is neither, and its own web runtime (milestone 3) will be its own target
  # through the same facade, so those two variants were dropped rather than kept
  # green for nobody. The plain build stays, because it is the check that emcc
  # can compile this core at all.
  build-wasm:
    name: build-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: install packages
        run: sudo apt-get install ninja-build

      - name: setup cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: ${{ env.EM_VERSION }}-${{ runner.os }}

      - name: emsdk install
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      - name: mkdir
        run: mkdir -p out

      - name: cmake
        run: emcmake cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DWASM=true

      - name: build
        run: emmake cmake --build out
